{% extends "app.html" %}

{% block content %}

<div class="row-justify-content-center">
  <div class="col-sm-6">
   <h2 class="text-muted">Login</h2>

   {% if form.non_field_errors %}

   <small class="text-danger">
     {{ form.non_field_errors.as_ul }}
    </small>

   {% endif %}

  <form method="POST" action="{% url 'login' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="{{ form.username.id_for_label }}">Username:</label>
      <input type="text" class="form-control" id="username" name="{{ form.username.name }}" required>
      <span class="text-danger">{{ form.username.errors }}</span>
    </div>

    <div class="form-group">
      <label for="{{ form.password.id_for_label }}">password:</label>
      <input type="password" class="form-control" id="password" name="{{ form.password.name }}" required>
      <span class="text-danger">{{ form.password.errors }}</span>
    </div>

    <button type="submit" class="btn btn-primary">Login</button>
    <a href="{% url 'register' %}" class="btn btn-secondary">Register here</a>
  </form>
</div>
</div>
{% endblock %}
